stages:
  prepare:
    cmd: python -m src.data.prepare
    deps:
      - data/original
      - src/data/schema.py
      - src/data/prepare.py
    params:
      - data
    outs:
      - data/prepared

  audit:
    cmd: python -m src.data.audit
    deps:
      - data/original
      - data/prepared
      - src/data/schema.py
      - src/data/audit.py
    params:
      - data
    outs:
      - evidencias/auditoria.json:
          cache: false
